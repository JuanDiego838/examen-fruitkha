<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Juan Diego Gallego Galvis">
  <meta name="keywords" content="frutas, organicas, frescas, tienda online">
  <meta name="description" content="Fruitkha - Delicious Seasonal Fruits Online">
  <title>Fruitkha | Home</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- Tu CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Bloque Principal: Hero -->
  <header class="hero">
    
    <!-- Navegación con Bootstrap -->
    <nav class="navbar navbar-expand-lg hero__nav">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand hero__logo" href="#">
          <img src="assets/logo.png" alt="Fruitkha Logo" class="hero__logo-img">
        </a>
        
        <!-- Botón hamburguesa para celular -->
        <button class="navbar-toggler hero__toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú -->
        <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
          <ul class="navbar-nav hero__menu">
            <li class="nav-item"><a class="nav-link hero__link hero__link--active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link hero__link" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link hero__link" href="#">Pages</a></li>
            <li class="nav-item"><a class="nav-link hero__link" href="#">News</a></li>
            <li class="nav-item"><a class="nav-link hero__link" href="#">Contact</a></li>
            <li class="nav-item"><a class="nav-link hero__link" href="#">Shop</a></li>
          </ul>
        </div>

        <!-- Iconos derecha -->
        <div class="hero__icons d-flex gap-3">
          <i class="bi bi-cart2"></i>
          <i class="bi bi-search"></i>
        </div>
      </div>
    </nav>

    <!-- Contenido Central -->
    <div class="container hero__content">
      <div class="row justify-content-center align-items-center h-100">
        <div class="col-12 col-md-10 col-lg-8 text-center">
          <p class="hero__subtitle">FRESH & ORGANIC</p>
          <h1 class="hero__title">Delicious Seasonal Fruits</h1>
          
          <div class="hero__actions mt-4 d-flex justify-content-center gap-3 flex-column flex-sm-row">
            <a href="#" class="btn hero__btn hero__btn--solid">Fruit Collection</a>
            <a href="#" class="btn hero__btn hero__btn--outline">Contact Us</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenedores de las Uvas -->
    <div class="hero__grapes hero__grapes--left"></div>
    <div class="hero__grapes hero__grapes--right"></div>

  </header>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
